# Override file for local development builds
# Usage:
#   docker compose up -d          -> pulls pre-built images from OCIR (fast restart)
#   docker compose up --build -d  -> rebuilds from local code (after code changes)
#
# The build context is defined here so --build knows where to find the source.
# The image name is inherited from docker-compose.yml (OCIR registry).
#
# To completely reset test data: docker compose down -v

# services:
#   postgres:
#     volumes:
#       - postgres_test_data:/var/lib/postgresql/data
# 
#   redis:
#     volumes:
#       - redis_test_data:/data

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

